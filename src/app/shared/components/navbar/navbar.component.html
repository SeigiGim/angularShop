<div class="navbar bg-base-100 shadow-sm sticky top-0 z-50">
  <div class="container mx-auto px-4 flex w-full">

    <div class="flex-1 flex items-center gap-4">
      <a routerLink="/" class="btn btn-ghost text-xl normal-case">AngularShop</a>

      <div class="hidden md:flex gap-2">
        <a [routerLink]="[PATHS.PRODUCTS.ROOT]" routerLinkActive="btn-active" class="btn btn-ghost btn-sm">Productos</a>
      </div>
    </div>

    <div class="flex-1 flex justify-center px-4">
      <label class="input input-bordered flex items-center gap-2 w-full max-w-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-70" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" />
        </svg>
        <input type="search" class="grow" placeholder="Buscar productos..." aria-label="Buscar productos"
          (keydown.enter)="onSearch($event)" />
      </label>
    </div>

    <div class="flex-none flex items-center gap-2">

      <div class="dropdown dropdown-end">
        <div tabindex="0" role="button" class="btn btn-ghost btn-circle">
          <div class="indicator">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            <span class="badge badge-sm badge-primary indicator-item">8</span>
          </div>
        </div>
      </div>

      <div class="dropdown dropdown-end">
        @if(authStatus() === 'authenticated') {

        <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar border-2 border-primary">
          <div class="w-10 rounded-full">
            <img ngSrc="{{ sessionUser()?.avatar }}" [alt]="sessionUser()?.name ?? 'User avatar'" width="40" height="40"
              priority={false} />
          </div>
        </div>
        <ul tabindex="0" class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
          <li><a routerLink="/profile">Mi Perfil</a></li>
          <li><a>Ajustes</a></li>
          <li><a class="text-error cursor-pointer" (click)="logout()">Cerrar Sesión</a></li>
        </ul>
        }
      </div>
      <div class="flex gap-2">
        @if (authStatus() === 'not-authenticated') {
        <a routerLink="/auth/login" class="btn btn-ghost btn-sm">Login</a>
        <a routerLink="/auth/register" class="btn btn-primary btn-sm">Registro</a>
        }

      </div>
    </div>
  </div>
</div>
